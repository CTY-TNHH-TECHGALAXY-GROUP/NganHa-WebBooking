<!doctype html>
<html lang="vi" class="embedded-book-shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ORIA SPA 3D Menu</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      html.embedded-book-shell,
      html.embedded-book-shell body,
      html.embedded-book-shell #app,
      html.embedded-book-shell #scene {
        background: transparent !important;
      }

      html.embedded-book-shell .vignette,
      html.embedded-book-shell .build-mark {
        display: none !important;
      }
    </style>
  
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="ORIA SPA 3D service book"></canvas>
      <div class="vignette" aria-hidden="true"></div>

      <ul id="category-a11y" class="sr-list"></ul>

      <div class="hud">
        <div class="scene-instruction" aria-hidden="true">
          <div class="scene-instruction__kicker">KHÁM PHÁ NGÂN HÀ</div>
          <div class="scene-instruction__row">
            <h1>Chọn một chòm sao<br />để bắt đầu hành trình</h1>
          </div>
          <span class="scene-instruction__diamond"></span>
        </div>

        <div class="topbar">
          <button id="cartButton" class="cart-button" type="button" aria-label="Giỏ hàng, 0 dịch vụ">
            <svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none">
              <path d="M7 8h10l-.8 11H7.8L7 8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path>
              <path d="M9 8a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
            </svg>
            <span id="cartBadge" class="cart-badge">0</span>
          </button>
        </div>

        <aside id="serviceSheet" class="service-sheet" aria-live="polite">
          <div class="sheet-heading">
            <span id="sheetKicker" class="sheet-kicker">Danh mục</span>
            <h2 id="sheetTitle">ORIA SPA</h2>
          </div>
          <div id="serviceContent" class="service-content"></div>
        </aside>

        <aside id="cartDrawer" class="cart-drawer" aria-label="Giỏ hàng">
          <div class="cart-drawer__header">
            <div>
              <span class="sheet-kicker">Giỏ hàng</span>
              <h2>Dịch vụ đã chọn</h2>
            </div>
            <button id="closeCart" class="icon-button" type="button" aria-label="Đóng giỏ hàng">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              </svg>
            </button>
          </div>
          <div id="cartItems" class="cart-items"></div>
          <div class="cart-total">
            <span>Tạm tính</span>
            <strong id="cartSubtotal">0 đ</strong>
          </div>
        </aside>

        <div id="cartNotification" class="cart-notification" role="status" aria-live="polite"></div>

        <div class="mobile-arrows" aria-hidden="true">
          <button id="mobilePrev" type="button" aria-label="Danh mục trước">‹</button>
          <button id="mobileNext" type="button" aria-label="Danh mục tiếp theo">›</button>
        </div>

        <button id="btn-prev" type="button" aria-label="Trang trước">‹</button>
        <button id="btn-next" type="button" aria-label="Trang tiếp theo">›</button>
        <button id="btn-back-book" type="button">← Trở về</button>

        <div id="black-overlay" aria-hidden="true"></div>
        <div id="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh dịch vụ">
          <button id="lightbox-close" type="button" aria-label="Đóng ảnh">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
            Trở về
          </button>
          <img id="lightbox-img" alt="" />
        </div>

        <div class="build-mark">flipbook restored v69-unified-galaxy</div>
      </div>
    </div>

    <script type="module" src="../main.js?v=flipbook-restored-v69-unified-galaxy"></script>
  </body>
</html>
